<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking System: Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="title-bar">
    <h1>Hotel booking System: Login Page</h1>
</header>

<main class="main-box">
    <section class="top-area">
        <div class="logo-circle">Logo</div>
        <nav class="nav">
          <a class="nav-btn active" href="index.html">Find a Room</a>
          <a class="nav-btn" href="hotel-info.html">Hotel Information</a>
          <a class="nav-btn" href="user-page.html">User Page / Bookings</a>
          <a class="nav-btn" href="login.html">Log In</a>
          <a class="nav-btn admin-hidden" href="admin.html">Admin</a>
        </nav>
    </section>

    <section class="login-info">
        <p>
            Log in to manage your room bookings and adjust user settings:<br>
            (Or to see admin page for admins)
        </p>
    </section>
       

    <section class="login-box">
        <div class="login-form">
            <div class="login-left">
                <label>E-Mail:</label>
                <input type="email" class="real-input">

                <label>Password:</label>
                <input type="password" class="real-input">
            </div>

            <div class="login-right">
                <label>Remember Me:</label>
                <div class="remember-box">X</div>

                <button class="search-btn">Log In</button>
            </div>

        </div>
        
        <a class="register-link" href="#">Not a user yet? Register Here</a>

        

    </section>
    <div class="page-spacer"></div>
    <footer class="footer-bar">
        <div class="footer-col">
                <div class="footer-title">Contact Information</div>
                <div class="mini-line"></div>
                <div class="mini-line"></div>
                <div class="mini-line"></div>
        </div>
                   
        <div class="footer-col">
            <div class="footer-title">Address</div>
            <div class="mini-line"></div>
            <div class="mini-line"></div>
        </div>
        
        <div class="footer-col footer-right">
            <div class="footer-title">Copyright</div>
        </div>
    </footer>

</main>
</body>
</html>
