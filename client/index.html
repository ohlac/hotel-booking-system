<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name=""viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotellbokning</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-frame">

    <header class="title-bar">
      <h1>Hotel Booking System: Home Page</h1>
    </header>

    <main class="main-box">

      <section class="top-area">
        <div class="logo-circle">Logo</div>

        <nav class="nav">
          <a class="nav-btn active" href="/index.html">Find a Room</a>
          <a class="nav-btn" href="#">Hotel Information</a>
          <a class="nav-btn" href="#">User Page / Bookings</a>
          <a class="nav-btn" href="#">Log In</a>
          <a class="nav-btn admin-hidden" href="#">Admin</a>
        </nav>
      </section>

      <section class="find-panel">
        <h2>Find a Room</h2>

        <form class="find-form">
          
          <div class="field">
            <label>Check-in date</label>
            <input type="date" class="real-input">
          </div>

          <div class="field">
            <label>Check-out date</label>
            <input type="date" class="real-input">
          </div>
        

          <div class="field">
            <label>Room type</label>
            <select class="real-input">
                <option>Single</option>
                <option>Double</option>
                <option>Suite</option>
            </select>
          </div>
          <button class="search-btn">Search</button>
        </form>
      </section>

      <div class="section-title">Available Rooms</div>

      <section class="rooms" id="rooms-container">
        <p style="text-align: center; grid-column: 1/-1;">Laddar rum från databasen...</p>
      </section>

      <footer class="footer-bar">
        <div class="footer-col">
          <div class="footer-title">Contact Information</div>
          <div class="mini-line"></div>
          <div class="mini-line"></div>
          <div class="mini-line"></div>
        </div>

        <div class="footer-col">
          <div class="footer-title">Address</div>
          <div class="mini-line"></div>
          <div class="mini-line"></div>
        </div>

        <div class="footer-col footer-right">
          <div class="footer-title">Copyright</div>
        </div>
      </footer>

    </main>
    <script src="script.js"></script>
  </div>
</body>
</html>
