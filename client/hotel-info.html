<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Booking System: Hotel Information</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="main-box">

    <section class="top-area">
      <div class="logo-circle">Logo</div>

      <nav class="nav">
        <a class="nav-btn" href="index.html">Find a Room</a>
        <a class="nav-btn active" href="hotel-info.html">Hotel Information</a>
        <a class="nav-btn" href="user.html">User Page / Bookings</a>
        <a class="nav-btn" href="login.html">Log In</a>
        <a class="nav-btn admin-hidden" href="admin.html">Admin</a>
      </nav>
    </section>

    <section class="hotel-info-page">

      <h2 class="hotel-title">Hotel California</h2>

      <div class="hotel-desc">
        <div class="hotel-subtitle">Description</div>
        <div class="desc-line"></div>
        <div class="desc-line"></div>
        <div class="desc-line"></div>
        <div class="desc-line"></div>
        <div class="desc-line"></div>
      </div>

      <div class="hotel-grid">
        <div class="hotel-address">
          <div class="hotel-subtitle">Adress</div>
          <div class="addr-line"></div>
          <div class="addr-line"></div>
          <div class="addr-line"></div>
        </div>

        <div class="hotel-map">
          Google Maps<br>Embed
        </div>
      </div>

      <div class="hotel-pics-title">Pictures of the Hotel</div>

      <div class="hotel-slider">
        <div class="slider-arrow left">◀</div>
        <div class="slider-img"></div>
        <div class="slider-arrow right">▶</div>
      </div>

    </section>

    <footer class="footer-bar">
        <div class="footer-col">
          <div class="footer-title">Contact Information</div>
        </div>

        <div class="footer-col">
          <div class="footer-title">Address</div>
        </div>

        <div class="footer-col footer-right">
          <div class="footer-title">Copyright</div>
        </div>
      </footer>

  </main>
</body>
</html>
